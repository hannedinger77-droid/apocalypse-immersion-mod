plugins {
    id 'eclipse'
    id 'idea'
    id 'java'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[7.0,8)'
    id 'net.minecraftforge.renamer' version '1.1.8+'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${providers.systemProperty('java.version').get()}, " +
        "JVM: ${providers.systemProperty('java.vm.version').get()} (${providers.systemProperty('java.vendor').get()}), " +
        "Arch: ${providers.systemProperty('os.arch').get()}"

minecraft {
    mappings channel: mapping_channel, version: minecraft_version

    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir('run')
            args "-mixin.config=${mod_id}.mixins.json"
        }

        register('client') {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        register('server') {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        register('gameTestServer') {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')
            args '--mod', mod_id, '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    flatDir { dir 'libs' }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:$minecraft_version-$forge_version")

    // Compile against Lost Cities in your libs/ folder
    compileOnly files('libs/lostcities-stub.jar')

    // ForgeGradle 7 Mixin annotation processor
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
}

tasks.named('processResources', ProcessResources) {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.property('replaceProperties', replaceProperties)

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar) {
    manifest {
        attributes([
                'MixinConfigs': 'apocalypseimmersion.mixins.json',
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }
    archiveClassifier = 'unobfuscated'
}

renamer.mappings.from minecraft.dependency.toSrgFile

renamer.enableMixinRefmaps {
    config "${mod_id}.mixins.json"
    refMap = "${mod_id}.refmap.json"
}

renamer.classes(tasks.named('jar', Jar)) {
    archiveClassifier = ''
    mappings renamer.mixin.generatedMappings
}

publishing {
    repositories {
        maven { url = layout.projectDirectory.dir('repo').asFile.toURI() }
    }

    publications.register('mavenJava', MavenPublication) {
        from components.java
        artifact renameJar
    }
}

tasks.withType(JavaCompile).configureEach {
    options.annotationProcessorPath = files(options.annotationProcessorPath, 'libs/lostcities-stub.jar')
    options.encoding = 'UTF-8'
}

idea.module { downloadJavadoc = downloadSources = true }

tasks.register('bumpPatchVersion') {
    doLast {
        def propsFile = file('gradle.properties')
        def text = propsFile.text
        def matcher = (text =~ /mod_version=(\d+)\.(\d+)\.(\d+)/)
        if (matcher.find()) {
            def major = matcher.group(1)
            def minor = matcher.group(2)
            def patch = (matcher.group(3) as int) + 1
            def nextVer = "${major}.${minor}.${patch}"
            propsFile.text = text.replaceFirst(/mod_version=\d+\.\d+\.\d+/, "mod_version=${nextVer}")
            println ">>> Bumped mod_version to ${nextVer} <<<"
        }
    }
}
tasks.named('renameJar') {
    finalizedBy 'bumpPatchVersion'
}
